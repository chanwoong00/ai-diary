spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aidiary?serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
gemini:
  base-url: ${GEMINI_API_BASE_URL:http://127.0.0.1:8000}